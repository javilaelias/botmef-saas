services:
  db:
    image: postgres:16
    container_name: botmef-saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: botmef_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:-botmef_owner}
      POSTGRES_DB: botmef
      APP_DB_PASSWORD: ${POSTGRES_APP_PASSWORD:-app_botmef}
    ports:
      - "${POSTGRES_HOST_PORT:-5438}:5432"
    volumes:
      - botmef_saas_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botmef_owner -d botmef"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7
    container_name: botmef-saas-redis
    restart: unless-stopped
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - botmef_saas_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  botmef_saas_pgdata:
    name: botmef_saas_pgdata
  botmef_saas_redisdata:
    name: botmef_saas_redisdata
